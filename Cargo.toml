[package]
name         = "stringy"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.91"
authors      = ["UncleSp1d3r <unclesp1d3r@evilbitlabs.io>"]
description  = "A smarter alternative to the strings command that leverages format-specific knowledge"
license      = "Apache-2.0"
repository   = "https://github.com/EvilBit-Labs/Stringy"
homepage     = "https://evilbitlabs.io/Stringy/"
keywords     = ["binary", "strings", "analysis", "reverse-engineering", "malware"]
categories   = ["command-line-utilities", "development-tools"]

[lib]
name = "stringy"
path = "src/lib.rs"

[[bin]]
name = "stringy"
path = "src/main.rs"

[dependencies]
clap           = { version = "4.5.60", features = [ "derive" ] }
cpp_demangle   = "0.5.1"
entropy        = "0.4.3"
goblin         = "0.10.5"
indicatif      = "0.18.4"
mmap-guard     = "0.2.0"
patharg        = "0.4.1"
pelite         = "0.10.0"
regex          = "1.12.3"
rustc-demangle = "0.1.27"
serde          = { version = "1.0.228", features = [ "derive" ] }
serde_json     = "1.0.149"
tempfile       = "3.27.0"
thiserror      = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.0"
criterion  = "0.8.2"
insta      = "1.46.3"
predicates = "3.1.4"

[profile.release]
opt-level    = 3
lto          = "thin"
codegen-units = 1
strip        = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto      = "fat"

[[bench]]
name    = "elf"
harness = false

[[bench]]
name    = "classification"
harness = false

[[bench]]
name    = "pe"
harness = false

[[bench]]
name    = "ascii_extraction"
harness = false
