[package]
name = "stringy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["UncleSp1d3r <unclesp1d3r@evilbitlabs.io>"]
description = "A smarter alternative to the strings command that leverages format-specific knowledge"
license = "Apache-2.0"
repository = "https://github.com/EvilBit-Labs/Stringy"
homepage = "http://evilbitlabs.io/Stringy/"
keywords = ["binary", "strings", "analysis", "reverse-engineering", "malware"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "stringy"
path = "src/lib.rs"

[[bin]]
name = "stringy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
entropy = "0.4.2"
goblin = "0.10.4"
lazy_static = "1.5"
pelite = "0.10.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"

[dev-dependencies]
criterion = "0.8.1"
insta = "1.46.0"
tempfile = "3.24.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[bench]]
name = "elf"
harness = false

[[bench]]
name = "pe"
harness = false

[[bench]]
name = "ascii_extraction"
harness = false
