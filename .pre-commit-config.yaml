# .pre-commit-config.yaml

repos:
    # 🧼 Standard code cleanup hooks (language agnostic)
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
            args: ["--maxkb=10240"]
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: check-illegal-windows-names
          - id: check-json
            types: [json]
          - id: check-toml
            types: [toml]
          - id: check-yaml
            args: [--allow-multiple-documents]
            types: [yaml]
          - id: check-xml
            types: [xml]
          - id: mixed-line-ending
            args: [--fix=auto]
            types: [text]
          - id: check-vcs-permalinks

    - repo: https://github.com/FeryET/pre-commit-rust
      rev: v1.2.1
      hooks:
          - id: fmt
            types: [rust]
          - id: clippy
            types: [rust]
          - id: cargo-check
            types: [cargo, cargo-lock]
          - id: build
            types: [rust]

    # 🧪 GitHub Actions validation
    - repo: https://github.com/rhysd/actionlint
      rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      hooks:
          - id: actionlint
            files: ".github/workflows/"
            exclude: ^.github/workflows/release.yml$
            types: [yaml]

    # 📝 Commit message linting (commit-msg only, not blocking push)
    - repo: https://github.com/commitizen-tools/commitizen
      rev: 286da5488db79f4cf5261e14a3c8976d89b5aa70 # v4.16.3
      hooks:
          - id: commitizen
            stages: [commit-msg]

    - repo: https://github.com/bnjbvr/cargo-machete
      rev: ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
      hooks:
          - id: cargo-machete
            types: [cargo]

    # 📝 Markdown formatting and linting
    - repo: https://github.com/executablebooks/mdformat
      rev: 1.0.0
      hooks:
          - id: mdformat
            additional_dependencies:
                - mdformat-gfm
                - mdformat-admon
                - mdformat-config
                - mdformat-footnote
                - mdformat-frontmatter
                - mdformat-simple-breaks
                - mdformat-web
                - mdformat-wikilink
                - mdformat-gfm-alerts
                - mdformat-rustfmt
                - mdformat-toc
            types: [markdown]

    # 🔒 Security audit for Rust dependencies (moved to CI)
    - repo: local
      hooks:
          - id: cargo-audit
            name: cargo-audit
            entry: cargo audit
            language: system
            pass_filenames: false
            always_run: true
            types: [cargo, cargo-lock]

    - repo: https://github.com/DevinR528/cargo-sort
      rev: 512b0139caa67e0ae1cd9cddf34108891e8656ac # v2.1.4
      hooks:
          - id: cargo-sort
            types: [cargo]
