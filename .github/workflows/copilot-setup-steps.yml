name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run just install
        run: |
          just install-tools

      - name: Setup summary
        run: |
          echo "Stringy development environment setup complete!"
          echo ""
          echo "Available tools:"
          echo "  - Rust toolchain: $(rustc --version)"
          echo "  - Cargo: $(cargo --version)"
          echo "  - just: $(just --version)"
          echo "  - cargo-nextest: $(cargo nextest --version)"
          echo "  - cargo-llvm-cov: $(cargo llvm-cov --version)"
          echo "  - cargo-audit: $(cargo audit --version)"
          echo "  - cargo-deny: $(cargo deny --version)"
          echo "  - cargo-dist: $(cargo dist --version)"
