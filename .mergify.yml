queue_rules:
  # Dosubot: only needs quality (fmt + clippy) to pass
  - name: dosubot
    merge_method: squash
    queue_conditions:
      - author = dosubot[bot]
      - base = main
    merge_conditions:
      - check-success = quality

  # Dependabot: full CI required
  - name: dependabot
    merge_method: squash
    queue_conditions:
      - author = dependabot[bot]
      - base = main
    merge_conditions:
      - check-success = quality
      - check-success = msrv (stable)
      - check-success = msrv (stable minus 1 releases)
      - check-success = msrv (stable minus 2 releases)
      - check-success = msrv (stable minus 3 releases)
      - check-success = msrv (stable minus 4 releases)
      - check-success = test
      - check-success = test-cross-platform (ubuntu-latest, Linux)
      - check-success = test-cross-platform (macos-latest, macOS)
      - check-success = test-cross-platform (windows-latest, Windows)
      - check-success = coverage

  # Human PRs: manually enqueued via /queue command (repo permissions restrict to maintainers)
  - name: default
    merge_method: squash
    queue_conditions:
      - base = main
      - author != dependabot[bot]
      - author != dosubot[bot]
    merge_conditions:
      - check-success = quality
      - check-success = msrv (stable)
      - check-success = msrv (stable minus 1 releases)
      - check-success = msrv (stable minus 2 releases)
      - check-success = msrv (stable minus 3 releases)
      - check-success = msrv (stable minus 4 releases)
      - check-success = test
      - check-success = test-cross-platform (ubuntu-latest, Linux)
      - check-success = test-cross-platform (macos-latest, macOS)
      - check-success = test-cross-platform (windows-latest, Windows)
      - check-success = coverage

pull_request_rules:
  - name: Auto-approve dosubot PRs
    description: Approve dosubot PRs so they can proceed through the queue
    conditions:
      - base = main
      - author = dosubot[bot]
    actions:
      review:
        type: APPROVE
        message: Automatically approved by Mergify

  - name: Auto-approve dependabot PRs
    description: Approve dependabot PRs so they can proceed through the queue
    conditions:
      - base = main
      - author = dependabot[bot]
    actions:
      review:
        type: APPROVE
        message: Automatically approved by Mergify

  - name: Keep PRs up to date with main
    conditions:
      - base = main
      - -conflict
      - -draft
    actions:
      update: {}

merge_protections:
  - name: Enforce conventional commit
    description: Make sure that we follow https://www.conventionalcommits.org/en/v1.0.0/
    if:
      - base = main
      - author != dependabot[bot]
      - author != dosubot[bot]
    success_conditions:
      - "title ~= ^(fix|feat|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\\(.+\\))?:"

  - name: Full CI must pass
    description: All CI checks must pass. This protection prevents manual merges that bypass the merge queue.
    if:
      - base = main
    success_conditions:
      - check-success = quality
      - check-success = msrv (stable)
      - check-success = msrv (stable minus 1 releases)
      - check-success = msrv (stable minus 2 releases)
      - check-success = msrv (stable minus 3 releases)
      - check-success = msrv (stable minus 4 releases)
      - check-success = test
      - check-success = test-cross-platform (ubuntu-latest, Linux)
      - check-success = test-cross-platform (macos-latest, macOS)
      - check-success = test-cross-platform (windows-latest, Windows)
      - check-success = coverage

  - name: Do not merge outdated PRs
    description: Make sure PRs are within 10 commits of the base branch before merging
    if:
      - base = main
    success_conditions:
      - "#commits-behind <= 10"
merge_protections_settings:
  # auto_merge_conditions reflects the queue_conditions of the queue rules that previously had autoqueue: true. The following queue rules were manual-only ('default') and remain reachable via the `/queue` command. Review and adjust if needed.
  auto_merge_conditions:
    - or:
        - and:
            - author = dosubot[bot]
            - base = main
        - and:
            - author = dependabot[bot]
            - base = main
  reporting_method: check-runs
